[project]
name = "aromascope"
version = "0.1.0"
description = "Sensor-free digital olfaction: predict odor descriptors from molecular structure."
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
